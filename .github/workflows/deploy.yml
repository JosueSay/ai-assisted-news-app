name: deploy

# Pruebas en PR/main. Publicación de Cloud Run y Hosting solo desde main,
# después de todas las pruebas y con las variables de GitHub production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias
        run: >
          pip install
          -r backend/assistant/requirements-dev.txt
          -r backend/news/requirements-dev.txt
      - name: Pytest backend
        working-directory: backend
        run: python -m pytest -q assistant/tests news/tests
      - name: Contrato de scripts de deploy (sin cloud ni secretos)
        run: make deploy-test
      - name: Integración feed, perfil y chat (MongoDB efímera)
        run: make news-integration-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validar cliente y export web (sin publicar)
        working-directory: frontend
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run export:web

  deploy:
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Variables del entorno production en GitHub; ninguna contiene secretos.
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      NEWS_FIREBASE_PROJECT_ID: ${{ vars.NEWS_FIREBASE_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      CHATBOT_PROVIDER: ${{ vars.CHATBOT_PROVIDER || 'openai' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      NEWS_CHAT_INPUT_USD_PER_MILLION: ${{ vars.NEWS_CHAT_INPUT_USD_PER_MILLION }}
      NEWS_CHAT_OUTPUT_USD_PER_MILLION: ${{ vars.NEWS_CHAT_OUTPUT_USD_PER_MILLION }}
      NEWS_API_ALLOWED_ORIGINS: ${{ vars.NEWS_API_ALLOWED_ORIGINS }}
      CHATBOT_ALLOWED_ORIGINS: ${{ vars.CHATBOT_ALLOWED_ORIGINS }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Revisar configuración de producción
        run: bash deploy/gcp/check-ci-config.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar frontend y Firebase CLI
        run: |
          npm ci --prefix frontend
          npm install --global firebase-tools@15.34.0
      - name: Generar APK Android y preparar enlace de descarga
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: make android-apk-ci
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publicar API y chatbot en Cloud Run
        run: bash deploy/gcp/deploy.sh
      - name: Renovar credenciales para Hosting
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Publicar frontend en Firebase Hosting
        run: bash deploy/firebase/ci.sh
