name: deploy

# Pruebas en cada PR y en main. El deploy a Cloud Run corre solo en main y solo cuando
# WIF_PROVIDER y DEPLOYER_SA ya tienen los valores que imprime deploy/gcp/bootstrap.sh.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias
        run: >
          pip install
          -r backend/assistant/requirements-dev.txt
          -r backend/news/requirements-dev.txt
      - name: Pytest backend
        working-directory: backend
        run: python -m pytest -q assistant/tests news/tests

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # No son secretos. Los imprime deploy/gcp/bootstrap.sh.
      WIF_PROVIDER: CAMBIAR
      DEPLOYER_SA: CAMBIAR
    steps:
      - id: cfg
        name: Revisar configuración
        run: |
          if [[ "$WIF_PROVIDER" == CAMBIAR* || "$DEPLOYER_SA" == CAMBIAR* ]]; then
            echo "::warning::Deploy omitido: falta configurar WIF_PROVIDER y DEPLOYER_SA."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.ready == 'true'
      - name: Build y deploy
        if: steps.cfg.outputs.ready == 'true'
        run: bash deploy/gcp/deploy.sh
