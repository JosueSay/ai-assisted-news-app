name: deploy

# Pruebas en cada PR y en main. El deploy a Cloud Run corre solo en main y solo cuando
# WIF_PROVIDER y DEPLOYER_SA ya tienen los valores que imprime deploy/gcp/bootstrap.sh.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias
        run: >
          pip install
          -r backend/assistant/requirements-dev.txt
          -r backend/news/requirements-dev.txt
      - name: Pytest backend
        working-directory: backend
        run: python -m pytest -q assistant/tests news/tests
      - name: Contrato de scripts de deploy (sin cloud ni secretos)
        run: make deploy-test
      - name: Integración feed, perfil y chat (MongoDB efímera)
        run: make news-integration-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validar cliente y export web (sin publicar)
        working-directory: frontend
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run export:web

  deploy:
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      # Variables del entorno production en GitHub; ninguna contiene secretos.
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      NEWS_FIREBASE_PROJECT_ID: ${{ vars.NEWS_FIREBASE_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      CHATBOT_PROVIDER: ${{ vars.CHATBOT_PROVIDER || 'stub' }}
      NEWS_CHAT_INPUT_USD_PER_MILLION: ${{ vars.NEWS_CHAT_INPUT_USD_PER_MILLION }}
      NEWS_CHAT_OUTPUT_USD_PER_MILLION: ${{ vars.NEWS_CHAT_OUTPUT_USD_PER_MILLION }}
      NEWS_API_ALLOWED_ORIGINS: ${{ vars.NEWS_API_ALLOWED_ORIGINS }}
      CHATBOT_ALLOWED_ORIGINS: ${{ vars.CHATBOT_ALLOWED_ORIGINS }}
    steps:
      - id: cfg
        name: Revisar configuración
        run: |
          if [[ -z "$WIF_PROVIDER" || -z "$DEPLOYER_SA" || -z "$PROJECT_ID" || "$WIF_PROVIDER" == CAMBIAR* || "$DEPLOYER_SA" == CAMBIAR* ]]; then
            echo "::warning::Deploy omitido: configura WIF_PROVIDER, DEPLOYER_SA y GCP_PROJECT_ID."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: google-github-actions/auth@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.cfg.outputs.ready == 'true'
      - name: Build y deploy
        if: steps.cfg.outputs.ready == 'true'
        run: bash deploy/gcp/deploy.sh
