services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: assistant
      # Compatibilidad de TCMalloc/rseq con kernels Linux 6.19 o posteriores.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - assistant_mongo_data:/data/db
      - ./backend/assistant/docker/mongo-init.js:/docker-entrypoint-initdb.d/001-assistant.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  chatbot:
    # Chatbot del assistant en modo news: lee ai_assisted_news (local o Atlas).
    build:
      context: ./backend
      dockerfile: assistant/Dockerfile
      target: runtime
    environment:
      CHATBOT_PROVIDER: ${CHATBOT_PROVIDER:-stub}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_API_KEY_FILE: /app/keys/openai_api_key
      CHATBOT_PROMPT_FILE: prompts/news.md
      CHATBOT_PROMPT_VERSION: ${CHATBOT_PROMPT_VERSION:-news-v1}
      CHATBOT_ALLOWED_ORIGINS: ${CHATBOT_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}
      MONGODB_CONTEXT_MODE: news
      MONGODB_REQUIRED: "true"
      NEWS_DB_MODE: ${NEWS_DB_MODE:-local}
      NEWS_MONGODB_DATABASE: ${NEWS_MONGODB_DATABASE:-ai_assisted_news}
      NEWS_MONGODB_TIMEOUT_MS: ${NEWS_MONGODB_TIMEOUT_MS:-5000}
      NEWS_MONGODB_URI_FILE: /app/keys/mongodb_uri
      NEWS_MONGODB_LOCAL_URI: mongodb://news-mongo:27017/${NEWS_MONGODB_DATABASE:-ai_assisted_news}
      CHAT_SESSION_TTL_SECONDS: ${CHAT_SESSION_TTL_SECONDS:-3600}
      NEWS_AI_BUDGET_USD: ${NEWS_AI_BUDGET_USD:-20}
      NEWS_CHAT_INPUT_USD_PER_MILLION: ${NEWS_CHAT_INPUT_USD_PER_MILLION:-}
      NEWS_CHAT_OUTPUT_USD_PER_MILLION: ${NEWS_CHAT_OUTPUT_USD_PER_MILLION:-}
      NEWS_CHAT_DEFAULT_LOCATION_CODE: ${NEWS_CHAT_DEFAULT_LOCATION_CODE:-GT}
    ports:
      - "8010:8010"
    volumes:
      - ./backend/assistant/prompts:/app/assistant/prompts:ro
      - ./keys:/app/keys:ro
    depends_on:
      news-mongo:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_HOST: ${EXPO_HOST:-lan}
      EXPO_PORT: ${EXPO_PORT:-8081}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      EXPO_PUBLIC_NEWS_API_BASE_URL: ${EXPO_PUBLIC_NEWS_API_BASE_URL:-http://localhost:8020}
      EXPO_PUBLIC_ASSISTANT_API_BASE_URL: ${EXPO_PUBLIC_ASSISTANT_API_BASE_URL:-http://localhost:8010}
    ports:
      - "${EXPO_PORT:-8081}:${EXPO_PORT:-8081}"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/app.json:/app/app.json
      - ./frontend/babel.config.js:/app/babel.config.js
      - ./frontend/index.ts:/app/index.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    command:
      [
        "sh",
        "-c",
        "npm start -- --host \"$${EXPO_HOST}\" --port \"$${EXPO_PORT}\"",
      ]
    stdin_open: true
    tty: true
    depends_on:
      news-api:
        condition: service_healthy
    restart: unless-stopped

  news-mongo:
    profiles: ["news-local"]
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: ${NEWS_MONGODB_DATABASE:-ai_assisted_news}
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "${NEWS_LOCAL_MONGO_PORT:-27018}:27017"
    volumes:
      - news_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  news-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/news/Dockerfile
      target: tools
    working_dir: /app/backend
    environment:
      NEWS_DB_MODE: ${NEWS_DB_MODE:-local}
      NEWS_MONGODB_DATABASE: ${NEWS_MONGODB_DATABASE:-ai_assisted_news}
      NEWS_MONGODB_REQUIRED: ${NEWS_MONGODB_REQUIRED:-true}
      NEWS_MONGODB_TIMEOUT_MS: ${NEWS_MONGODB_TIMEOUT_MS:-5000}
      NEWS_MONGODB_URI_FILE: /app/keys/mongodb_uri
      NEWS_MONGODB_LOCAL_URI: mongodb://news-mongo:27017/${NEWS_MONGODB_DATABASE:-ai_assisted_news}
      NEWS_ADMIN_USERNAME: ${NEWS_ADMIN_USERNAME:-admin}
      NEWS_ADMIN_PASSWORD_FILE: /app/keys/news_admin_password
      NEWS_ADMIN_TOKEN_TTL_SECONDS: ${NEWS_ADMIN_TOKEN_TTL_SECONDS:-3600}
      PYTEST_ADDOPTS: -p no:cacheprovider
    volumes:
      - ./backend:/app/backend
      - ./keys:/app/keys:ro
    restart: "no"

  news-api:
    build:
      context: .
      dockerfile: backend/news/Dockerfile
      target: tools
    working_dir: /app/backend
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "news.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8020",
      ]
    environment:
      NEWS_DB_MODE: ${NEWS_DB_MODE:-local}
      NEWS_MONGODB_DATABASE: ${NEWS_MONGODB_DATABASE:-ai_assisted_news}
      NEWS_MONGODB_REQUIRED: ${NEWS_MONGODB_REQUIRED:-true}
      NEWS_MONGODB_TIMEOUT_MS: ${NEWS_MONGODB_TIMEOUT_MS:-5000}
      NEWS_MONGODB_URI_FILE: /app/keys/mongodb_uri
      NEWS_MONGODB_LOCAL_URI: mongodb://news-mongo:27017/${NEWS_MONGODB_DATABASE:-ai_assisted_news}
      NEWS_ADMIN_USERNAME: ${NEWS_ADMIN_USERNAME:-admin}
      NEWS_ADMIN_PASSWORD_FILE: /app/keys/news_admin_password
      NEWS_ADMIN_TOKEN_TTL_SECONDS: ${NEWS_ADMIN_TOKEN_TTL_SECONDS:-3600}
      NEWS_API_ALLOWED_ORIGINS: ${NEWS_API_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}
    ports:
      - "${NEWS_API_PORT:-8020}:8020"
    volumes:
      - ./backend:/app/backend
      - ./keys:/app/keys:ro
    depends_on:
      news-mongo:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: assistant/Dockerfile
      target: test
    command: ["python", "-m", "pytest", "-q", "assistant/tests"]
    environment:
      CHATBOT_PROVIDER: stub
      API_GPT: ""
      CHATBOT_PROMPT_FILE: prompts/system.md
      MONGODB_URI: ""
      ASSISTANT_BASE_URL: http://chatbot:8010
    depends_on:
      chatbot:
        condition: service_healthy
    restart: "no"

volumes:
  assistant_mongo_data:
  news_mongo_data:
